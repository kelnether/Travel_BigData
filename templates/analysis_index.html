<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>历史数据分析展示</title>
  <!-- 引入 Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* 简单的标签样式 */
    .tabs {
      display: flex;
      margin-bottom: 20px;
    }
    .tab-button {
      padding: 10px 20px;
      border: 1px solid #ccc;
      background-color: #f1f1f1;
      cursor: pointer;
      margin-right: 2px;
    }
    .tab-button.active {
      background-color: #fff;
      border-bottom: none;
      font-weight: bold;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>
  <h1>历史数据分析展示</h1>

  <!-- 景点选择控件 -->
  <label for="scenicSelect">选择景点：</label>
  <select id="scenicSelect">
    <option value="">所有景点</option>
  </select>

  <!-- 标签导航 -->
  <div class="tabs">
    <button class="tab-button active" data-tab="hourly-tab">按小时统计</button>
    <button class="tab-button" data-tab="daily-tab">每日趋势</button>
    <button class="tab-button" data-tab="scenic-tab">景点分布</button>
  </div>

  <!-- 标签内容区域 -->
  <div id="hourly-tab" class="tab-content active">
    <canvas id="historyChart" width="800" height="400"></canvas>
  </div>
  <div id="daily-tab" class="tab-content">
    <canvas id="dailyChart" width="800" height="400"></canvas>
  </div>
  <div id="scenic-tab" class="tab-content">
    <canvas id="scenicChart" width="800" height="400"></canvas>
  </div>

  <script>
    let historyChart = null;
    let dailyChart = null;
    let scenicChart = null;

    // 根据选定景点获取按小时统计数据并更新图表
    function fetchHistoryData(scenic) {
      let url = '/analysis/api/history';
      if(scenic) {
        url += `?scenic=${encodeURIComponent(scenic)}`;
      }
      fetch(url)
        .then(response => response.json())
        .then(data => {
          // 统计每个小时的总客流量
          const hourlyCounts = {};
          data.forEach(item => {
            const hour = item.hour;
            if (!hourlyCounts[hour]) {
              hourlyCounts[hour] = 0;
            }
            hourlyCounts[hour] += item.visitor_count;
          });
          const labels = Object.keys(hourlyCounts).sort((a, b) => a - b);
          const counts = labels.map(hour => hourlyCounts[hour]);

          const ctx = document.getElementById('historyChart').getContext('2d');
          if(historyChart){
            historyChart.destroy();
          }
          historyChart = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [{
                label: '客流量',
                data: counts,
                backgroundColor: 'rgba(54, 162, 235, 0.6)'
              }]
            },
            options: {
              scales: {
                y: { beginAtZero: true }
              }
            }
          });
        });
    }

    // 获取每日总客流数据并绘制折线图，支持景点过滤
    function fetchDailyData(scenic) {
      let url = '/analysis/api/daily_total';
      if (scenic) {
        url += `?scenic=${encodeURIComponent(scenic)}`;
      }
      fetch(url)
        .then(response => response.json())
        .then(data => {
          // 排序日期（假设日期格式为 YYYY-MM-DD）
          data.sort((a, b) => new Date(a.date) - new Date(b.date));
          const labels = data.map(item => item.date);
          const counts = data.map(item => item.visitor_count);
          const ctx = document.getElementById('dailyChart').getContext('2d');
          if(dailyChart){
            dailyChart.destroy();
          }
          dailyChart = new Chart(ctx, {
            type: 'line',
            data: {
              labels: labels,
              datasets: [{
                label: '每日总客流量',
                data: counts,
                fill: false,
                borderColor: 'rgba(255, 99, 132, 1)',
                tension: 0.1
              }]
            },
            options: {
              scales: {
                y: { beginAtZero: true }
              }
            }
          });
        });
    }

    // 获取各景点总客流数据并绘制饼图（该图表不受景点筛选影响）
    function fetchScenicDistribution() {
      fetch('/analysis/api/scenic_distribution')
        .then(response => response.json())
        .then(data => {
          const labels = data.map(item => item.scenic);
          const counts = data.map(item => item.visitor_count);
          const ctx = document.getElementById('scenicChart').getContext('2d');
          if(scenicChart){
            scenicChart.destroy();
          }
          scenicChart = new Chart(ctx, {
            type: 'pie',
            data: {
              labels: labels,
              datasets: [{
                label: '各景点总客流量',
                data: counts,
                // 使用默认调色板
              }]
            },
            options: {
              responsive: true,
            }
          });
        });
    }

    // 加载所有景点名称，填充下拉框
    function loadScenicNames() {
      fetch('/analysis/api/scenic_names')
        .then(response => response.json())
        .then(data => {
          const select = document.getElementById('scenicSelect');
          data.forEach(scenic => {
            const option = document.createElement('option');
            option.value = scenic;
            option.text = scenic;
            select.appendChild(option);
          });
        });
    }

    // 标签切换逻辑
    function setupTabs() {
      const tabButtons = document.querySelectorAll('.tab-button');
      tabButtons.forEach(button => {
        button.addEventListener('click', function(){
          // 移除所有按钮的 active 类
          tabButtons.forEach(btn => btn.classList.remove('active'));
          this.classList.add('active');
          // 隐藏所有标签内容
          const contents = document.querySelectorAll('.tab-content');
          contents.forEach(content => content.classList.remove('active'));
          // 显示对应的标签内容
          const tabId = this.getAttribute('data-tab');
          document.getElementById(tabId).classList.add('active');
        });
      });
    }

    // 页面加载后初始化
    document.addEventListener('DOMContentLoaded', function(){
      loadScenicNames();
      // 默认加载所有数据（未过滤）的按小时统计图和每日趋势图
      fetchHistoryData("");
      fetchDailyData("");
      fetchScenicDistribution();
      setupTabs();

      // 当用户选择景点时，更新按小时统计和每日趋势图
      document.getElementById('scenicSelect').addEventListener('change', function(){
        const scenic = this.value;
        fetchHistoryData(scenic);
        fetchDailyData(scenic);
      });
    });
  </script>
</body>
</html>
